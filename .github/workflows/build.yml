name: Build GKI 5.15 + KernelSU

# main = 正式内核; debug = 调试内核 (完整日志 + SELinux 写死宽容)
# 每次 push 自动构建并发布 Release (版本号自动递增, 见 scripts/bump_version.sh)
# 手动触发可指定版本递增方式: patch=修补(默认) / minor=补丁 / major=重大更新
on:
  push:
    branches: [main, debug]
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式 (x.x.x = 重大更新.补丁.修补)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  BRANCH: ${{ github.ref_name }}
  IS_DEBUG: ${{ github.ref_name == 'debug' }}
  DEBUG_PREFIX: ${{ github.ref_name == 'debug' && 'debug-' || '' }}
  # 谷歌官方 GKI 5.15 tag — 与设备原版内核 config.gz 的 5.15.167 对应
  GKI_TAG: android13-5.15.167_r00
  # ReSukiSU: 最新版 KSU (v34993+, 兼容官方 Manager 32525) + 内置 SusFS 适配
  # 注意: ReSukiSU 已移除 KPM (KernelPatch), 如需 KPM 请改用 SukiSU-Ultra
  KSU_TAG: main
  KSU_REPO: ReSukiSU/ReSukiSU
  # SusFS 对应 GKI 5.15 的分支 (内核侧补丁与 KSU 变体无关)
  SUSFS_BRANCH: gki-android13-5.15
  # clang 17.0.4 (LLVM 官方 release, 与 GKI 5.15 官方构建的 clang 17 同代)
  CLANG_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libssl-dev libelf-dev \
            flex bison libncurses-dev dwarves python3 ccache zip

      - name: Download clang 17 (LLVM)
        run: |
          curl -LSs -o clang.tar.xz "${CLANG_URL}"
          mkdir -p clang && tar -xJf clang.tar.xz -C clang --strip-components=1
          echo "${{ github.workspace }}/clang/bin" >> "$GITHUB_PATH"

      # ccache: 二次构建命中缓存, 大幅加速迭代 (首次构建无收益)
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.GKI_TAG }}-${{ env.KSU_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.GKI_TAG }}-${{ env.KSU_TAG }}-
            ccache-${{ env.GKI_TAG }}-

      - name: Clone Google GKI kernel source
        run: |
          git clone --depth 1 -b "${GKI_TAG}" \
            https://android.googlesource.com/kernel/common kernel

      # 必须先集成 KernelSU 再 olddefconfig, 否则 CONFIG_KSU 符号不会进入 .config
      # ReSukiSU setup.sh 已内置其仓库 clone URL
      - name: Integrate KernelSU (ReSukiSU)
        run: |
          cd kernel
          curl -LSs -o setup.sh \
            "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_TAG}/kernel/setup.sh"
          bash setup.sh "${KSU_TAG}"
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo "[+] ReSukiSU 集成完成"

      # SusFS: 仅需内核侧补丁 (ReSukiSU 自带 KSU_SUSFS 驱动侧支持, 不打 10_enable)
      - name: Integrate SusFS kernel patches
        run: |
          cd kernel
          git clone --depth 1 -b "${SUSFS_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch .
          # 整目录复制 (fs/ 含 susfs.c; include/linux/ 含 susfs.h + susfs_def.h)
          cp -r susfs4ksu/kernel_patches/fs/. fs/
          cp -r susfs4ksu/kernel_patches/include/linux/. include/linux/
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          echo "[+] SusFS 内核补丁完成"

      - name: Apply device config (config.gz -> .config)
        run: |
          gzip -dc "${{ github.workspace }}/config.gz" > kernel/.config
          cd kernel
          make ARCH=arm64 LLVM=1 olddefconfig
          # 清除厂商构建机环境依赖 (纯 GKI 构建无需):
          # 1. abi_symbollist.raw 是联想构建机的绝对路径, 必须删除否则构建失败
          ./scripts/config --undefine UNUSED_KSYMS_WHITELIST
          # 2. 无 whitelist 的 trim 会移除 vendor 模块依赖的导出符号
          ./scripts/config --undefine TRIM_UNUSED_KSYMS
          # 3. Full LTO 在 16GB runner 上易 OOM, 改用官方 GKI 同款 thin LTO
          ./scripts/config --undefine LTO_CLANG_FULL
          ./scripts/config --enable LTO_CLANG_THIN
          make ARCH=arm64 LLVM=1 olddefconfig
          # 保险: CONFIG_KSU / KSU_SUSFS (ReSukiSU default n, 必须显式开启;
          # 该符号同时控制内核侧 fs/susfs.o 编译, 无独立 CONFIG_SUSFS)
          grep -q "^CONFIG_KSU=y" .config || {
            ./scripts/config --enable KSU
            make ARCH=arm64 LLVM=1 olddefconfig
          }
          grep -q "^CONFIG_KSU_SUSFS=y" .config || {
            ./scripts/config --enable KSU_SUSFS
            make ARCH=arm64 LLVM=1 olddefconfig
          }
          # === 性能优化 (针对厂商工程配置) ===
          # 1. KASAN: 内存错误检测器, 20-50% 性能损失, 量产内核必须关闭
          ./scripts/config --disable KASAN
          # 2. UBSAN: 未定义行为检测, 额外运行时开销
          ./scripts/config --disable UBSAN
          # 3. SLUB_DEBUG: slub 分配器调试, 内存与性能开销
          ./scripts/config --disable SLUB_DEBUG
          # 4. HZ 250 -> 1000: 调度 tick 更密, 交互/游戏更跟手
          ./scripts/config --disable HZ_250
          ./scripts/config --enable HZ_1000
          ./scripts/config --set-val HZ 1000
          # 5. NR_CPUS 32 -> 8: bengal 仅 8 核, 减小 percpu 数组内存/cache 压力
          ./scripts/config --set-val NR_CPUS 8
          # === Debug 分支: 调试内核附加项 (正式分支不受影响) ===
          if [ "$IS_DEBUG" = "true" ]; then
            echo "[debug] 应用调试配置"
            ./scripts/config --disable PANIC_ON_OOPS       # oops 不重启, 保留崩溃现场
            ./scripts/config --set-val LOG_BUF_SHIFT 19    # 512KB 日志缓冲
            ./scripts/config --enable DYNAMIC_DEBUG        # 全量动态调试
            ./scripts/config --enable DEBUG_ATOMIC_SLEEP   # 原子上下文睡眠检测
            ./scripts/config --disable SECURITY_DMESG_RESTRICT  # 允许非 root 读 dmesg
          fi
          make ARCH=arm64 LLVM=1 olddefconfig
          # 验证关键项 (注: PREEMPT_DYNAMIC 为 6.x 特性, 5.15 无此符号)
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KALLSYMS=|^CONFIG_KASAN=|^CONFIG_UBSAN=|^CONFIG_HZ=|^CONFIG_NR_CPUS=|^CONFIG_PANIC_ON_OOPS=|^CONFIG_LOG_BUF_SHIFT=" .config

      - name: Build kernel Image
        run: |
          ccache --max-size=6G
          cd kernel
          make ARCH=arm64 LLVM=1 CC="ccache clang" HOSTCC="ccache gcc" \
            -j"$(nproc)" Image

      - name: Repack boot.img
        run: |
          if [ "$IS_DEBUG" = "true" ]; then
            # Debug: 仅产出带宽容 cmdline 的调试内核
            python3 scripts/repack.py \
              --input boot_a.img \
              --kernel kernel/arch/arm64/boot/Image \
              --cmdline "androidboot.selinux=permissive enforcing=0" \
              --output boot-debug.img
          else
            python3 scripts/repack.py \
              --input boot_a.img \
              --kernel kernel/arch/arm64/boot/Image \
              --output boot.img
          fi

      # AnyKernel3 刷机包: 设备端 (TWRP/Manager) 直接刷入, 无需电脑 fastboot
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3 AK3
          rm -rf AK3/.git
          cp kernel/arch/arm64/boot/Image AK3/Image
          if [ "$IS_DEBUG" = "true" ]; then
            sed -i 's|kernel.string=.*|kernel.string=TB331FC DEBUG Kernel (ReSukiSU + SusFS + Selinux permissive)|' AK3/anykernel.sh
            cd AK3 && zip -r ../TB331FC-debug-AnyKernel3.zip ./* > /dev/null && cd ..
            ls -la TB331FC-debug-AnyKernel3.zip
          else
            sed -i 's|kernel.string=.*|kernel.string=TB331FC KernelSU (ReSukiSU + SusFS)|' AK3/anykernel.sh
            cd AK3 && zip -r ../TB331FC-AnyKernel3.zip ./* > /dev/null && cd ..
            ls -la TB331FC-AnyKernel3.zip
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tb331fc-${{ env.DEBUG_PREFIX }}boot-ksu
          path: |
            boot${{ env.IS_DEBUG == 'true' && '-debug' || '' }}.img
            TB331FC${{ env.IS_DEBUG == 'true' && '-debug' || '' }}-AnyKernel3.zip
            kernel/arch/arm64/boot/Image
            kernel/.config
          retention-days: 30

      # 自动发布 Release: 版本号 x.x.x (重大更新.补丁.修补); debug 分支独立序列 debug-vX.Y.Z
      - name: Publish Release
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          VERSION=$(bash scripts/bump_version.sh "$BUMP" "${DEBUG_PREFIX}")
          echo "发布版本: ${VERSION} (bump=$BUMP)"
          if [ "$IS_DEBUG" = "true" ]; then
            gh release create "${VERSION}" \
              boot-debug.img \
              TB331FC-debug-AnyKernel3.zip \
              kernel/arch/arm64/boot/Image \
              --title "TB331FC DEBUG Kernel ${VERSION}" \
              --notes "调试内核: ReSukiSU + SusFS v2.2.0 + SELinux 写死宽容

          - 日志: pstore/ramoops + 512KB 缓冲 + 全量动态调试 + oops 不重启
          - 宽容: androidboot.selinux=permissive enforcing=0 (开机即 permissive)
          - 刷机: AK3 zip 设备端直接刷入, 或 fastboot flash boot boot-debug.img
          - 拉日志: cat /sys/fs/pstore/console-ramoops-0"
          else
            gh release create "${VERSION}" \
              boot.img \
              TB331FC-AnyKernel3.zip \
              kernel/arch/arm64/boot/Image \
              --title "TB331FC Kernel ${VERSION}" \
              --notes "KernelSU (ReSukiSU) + SusFS v2.2.0 内核

          - 内核: GKI android13-5.15.167 (与设备 stock KMI 一致)
          - 特性: KernelSU 349xx (多管理器, 兼容官方 Manager) + SusFS + 性能优化 (关 KASAN/UBSAN, HZ=1000, NR_CPUS=8)
          - 刷机: AK3 zip 设备端直接刷入, 或 fastboot flash boot boot.img"
          fi
