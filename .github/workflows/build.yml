# TB331FC 内核构建 — 单 Release 三产物
# 每个 Release 包含 3 个变体:
#   main    = 原汁原味 KernelSU + SusFS (无性能优化)
#   debug   = main + 调试日志 (内核日志/pstore/宽容)
#   feature = main + 实验性优化补丁 (O3/PELT/zstd 等, 不稳定)
# 矩阵并行构建, 汇总发布为一个 Release (版本号 x.x.x, 手动可 bump)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增方式 (x.x.x = 重大更新.补丁.修补)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# 同一分支只保留最新构建, 防止并发 Release 版本竞争
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 谷歌官方 GKI 5.15 tag — 与设备原版内核 config.gz 的 5.15.167 对应
  GKI_TAG: android13-5.15.167_r00
  # 原版 KernelSU main 分支: SusFS gki-android13-5.15 分支与之持续同步, 补丁完全匹配
  KSU_TAG: main
  KSU_REPO: tiann/KernelSU
  # SusFS 对应 GKI 5.15 的分支 (内核侧补丁与 KSU 变体无关)
  SUSFS_BRANCH: gki-android13-5.15
  # clang 17.0.4 (LLVM 官方 release, 与 GKI 5.15 官方构建的 clang 17 同代)
  CLANG_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [main, debug, feature]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libssl-dev libelf-dev \
            flex bison libncurses-dev dwarves python3 ccache zip

      - name: Download clang 17 (LLVM)
        run: |
          curl -LSs -o clang.tar.xz "${CLANG_URL}"
          mkdir -p clang && tar -xJf clang.tar.xz -C clang --strip-components=1
          echo "${{ github.workspace }}/clang/bin" >> "$GITHUB_PATH"

      # ccache: 二次构建命中缓存, 大幅加速迭代 (首次构建无收益)
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.GKI_TAG }}-${{ env.VARIANT }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.GKI_TAG }}-${{ env.VARIANT }}-
            ccache-${{ env.GKI_TAG }}-

      - name: Clone Google GKI kernel source
        run: |
          git clone --depth 1 -b "${GKI_TAG}" \
            https://android.googlesource.com/kernel/common kernel

      # 必须先集成 KernelSU 再 olddefconfig, 否则 CONFIG_KSU 符号不会进入 .config
      - name: Integrate KernelSU (原版)
        run: |
          cd kernel
          curl -LSs -o setup.sh \
            "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_TAG}/kernel/setup.sh"
          bash setup.sh "${KSU_TAG}"
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo "[+] KernelSU 集成完成"

      # SusFS: 10_enable 补丁 (给 KernelSU 驱动侧) + 50_add 补丁 (给内核侧)
      - name: Integrate SusFS patches
        run: |
          cd kernel
          git clone --depth 1 -b "${SUSFS_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu susfs4ksu
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch .
          # 整目录复制 (fs/ 含 susfs.c; include/linux/ 含 susfs.h + susfs_def.h)
          cp -r susfs4ksu/kernel_patches/fs/. fs/
          cp -r susfs4ksu/kernel_patches/include/linux/. include/linux/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          echo "[+] SusFS 补丁完成"

      # 性能补丁: PELT half-life 32ms -> 16ms (仅 feature 变体)
      - name: Apply performance patches (PELT 16ms, feature only)
        if: env.VARIANT == 'feature'
        run: |
          cd kernel
          patch -p1 < "${{ github.workspace }}/scripts/patch/pelt-half-life-16ms.patch"
          grep -E "^#define LOAD_AVG_PERIOD" kernel/sched/sched-pelt.h
          echo "[+] PELT 16ms 补丁完成"

      - name: Apply device config (config.gz -> .config)
        run: |
          gzip -dc "${{ github.workspace }}/config.gz" > kernel/.config
          cd kernel
          make ARCH=arm64 LLVM=1 olddefconfig
          # 清除厂商构建机环境依赖 (纯 GKI 构建无需):
          # 1. abi_symbollist.raw 是联想构建机的绝对路径, 必须删除否则构建失败
          ./scripts/config --undefine UNUSED_KSYMS_WHITELIST
          # 2. 无 whitelist 的 trim 会移除 vendor 模块依赖的导出符号
          ./scripts/config --undefine TRIM_UNUSED_KSYMS
          # 3. Full LTO 在 16GB runner 上易 OOM, 改用官方 GKI 同款 thin LTO
          ./scripts/config --undefine LTO_CLANG_FULL
          ./scripts/config --enable LTO_CLANG_THIN
          make ARCH=arm64 LLVM=1 olddefconfig
          # 保险: CONFIG_KSU / KSU_SUSFS (由 10_enable 补丁添加, default y 兜底;
          # 该符号同时控制内核侧 fs/susfs.o 编译, 无独立 CONFIG_SUSFS)
          grep -q "^CONFIG_KSU=y" .config || {
            ./scripts/config --enable KSU
            make ARCH=arm64 LLVM=1 olddefconfig
          }
          grep -q "^CONFIG_KSU_SUSFS=y" .config || {
            ./scripts/config --enable KSU_SUSFS
            make ARCH=arm64 LLVM=1 olddefconfig
          }
          # === 性能优化 (仅 feature 变体; main/debug 原汁原味) ===
          if [ "$VARIANT" = "feature" ]; then
            ./scripts/config --disable KASAN
            ./scripts/config --disable UBSAN
            ./scripts/config --disable SLUB_DEBUG
            ./scripts/config --disable HZ_250
            ./scripts/config --enable HZ_1000
            ./scripts/config --set-val HZ 1000
            ./scripts/config --set-val NR_CPUS 8
            ./scripts/config --disable ZRAM_DEF_COMP_LZORLE
            ./scripts/config --enable ZRAM_DEF_COMP_ZSTD
          fi
          # === Debug 变体: 调试内核附加项 ===
          # (注: pstore/ramoops 与 dmesg 权限原版 config 已具备, 无需在此配置)
          if [ "$VARIANT" = "debug" ]; then
            ./scripts/config --disable PANIC_ON_OOPS       # oops 不重启, 保留崩溃现场
            ./scripts/config --set-val LOG_BUF_SHIFT 19    # 512KB 日志缓冲
            ./scripts/config --enable DYNAMIC_DEBUG        # 全量动态调试
            ./scripts/config --enable DEBUG_ATOMIC_SLEEP   # 原子上下文睡眠检测
          fi
          make ARCH=arm64 LLVM=1 olddefconfig
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_KALLSYMS=|^CONFIG_KASAN=|^CONFIG_HZ=|^CONFIG_PANIC_ON_OOPS=" .config

      - name: Build kernel Image
        run: |
          ccache --max-size=2G   # 三变体并行, GitHub 单仓库 cache 上限 10GB, 2G/变体更实际
          cd kernel
          # 全局 -O3 (仅 feature 变体)
          if [ "$VARIANT" = "feature" ]; then
            echo 'KBUILD_CFLAGS += -O3' >> Makefile
          fi
          make ARCH=arm64 LLVM=1 CC="ccache clang" HOSTCC="ccache gcc" \
            -j"$(nproc)" Image

      - name: Repack boot.img
        run: |
          # 注意: 严禁注入 cmdline! 原版 boot cmdline 全空, 高通 ABL 对非空
          # cmdline 处理有缺陷, 会导致无法开机 (已实机验证, 两次不同内核均失败)
          python3 scripts/repack.py \
            --input boot_a.img \
            --kernel kernel/arch/arm64/boot/Image \
            --output "boot-${VARIANT}.img"

      # AnyKernel3 刷机包: 设备端 (TWRP/Manager) 直接刷入, 无需电脑 fastboot
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3 AK3
          rm -rf AK3/.git
          cp kernel/arch/arm64/boot/Image AK3/Image
          case "$VARIANT" in
            debug)   sed -i 's|kernel.string=.*|kernel.string=TB331FC DEBUG Kernel (KSU + SusFS + Selinux permissive)|' AK3/anykernel.sh ;;
            feature) sed -i 's|kernel.string=.*|kernel.string=TB331FC EXPERIMENTAL Kernel (KSU + SusFS + O3/PELT)|' AK3/anykernel.sh ;;
            *)       sed -i 's|kernel.string=.*|kernel.string=TB331FC KernelSU (KSU + SusFS)|' AK3/anykernel.sh ;;
          esac
          cd AK3 && zip -r "../TB331FC-${VARIANT}-AnyKernel3.zip" ./* > /dev/null && cd ..
          ls -la *.img *.zip

      - name: Prepare variant files
        run: |
          # 改名后上传, 避免三变体同名文件 (Image/.config) 互相覆盖;
          # 同时规避 upload-artifact v4 忽略隐藏文件 (.config) 的问题
          cp kernel/arch/arm64/boot/Image "Image-${VARIANT}"
          cp kernel/.config "config-${VARIANT}"
      - name: Upload variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: variant-${{ env.VARIANT }}
          path: |
            boot-${{ env.VARIANT }}.img
            TB331FC-${{ env.VARIANT }}-AnyKernel3.zip
            Image-${{ env.VARIANT }}
            config-${{ env.VARIANT }}
          retention-days: 30

  # 汇总三个变体产物, 发布为单个 Release
  # needs 默认语义: build 全部成功才运行, 失败自动跳过 (不留红叉)
  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all variants
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release (三产物)
        run: |
          # 任一变体失败则不发布
          for v in main debug feature; do
            [ -f "artifacts/boot-${v}.img" ] || { echo "[ERROR] 缺少 ${v} 产物, 不发布"; exit 1; }
          done
          BUMP="${{ inputs.bump || 'patch' }}"
          VERSION=$(bash scripts/bump_version.sh "$BUMP")
          echo "发布版本: ${VERSION} (bump=$BUMP)"
          gh release create "${VERSION}" \
            artifacts/boot-main.img \
            artifacts/boot-debug.img \
            artifacts/boot-feature.img \
            artifacts/TB331FC-main-AnyKernel3.zip \
            artifacts/TB331FC-debug-AnyKernel3.zip \
            artifacts/TB331FC-feature-AnyKernel3.zip \
            --title "TB331FC Kernel ${VERSION}" \
            --notes "三个变体: 原汁原味 / 调试 / 实验优化

          **boot-main.img / TB331FC-main-AnyKernel3.zip** — 原汁原味
          - 原版 KernelSU (325xx+, 官方 Manager 兼容) + SusFS 2.2.0
          - 无性能优化, 与 stock KMI 一致

          **boot-debug.img / TB331FC-debug-AnyKernel3.zip** — 调试
          - main + pstore/ramoops + 512KB 缓冲 + 动态调试 + oops 不重启
          - SELinux 写死宽容 (androidboot.selinux=permissive enforcing=0)
          - 拉日志: cat /sys/fs/pstore/console-ramoops-0

          **boot-feature.img / TB331FC-feature-AnyKernel3.zip** — 实验 (不稳定)
          - main + -O3 全局编译 / PELT half-life 16ms / zram zstd / HZ=1000 / 关 KASAN
          - 建议 fastboot boot 临时引导测试

          刷机: fastboot flash boot boot-<变体>.img, 或 AK3 zip 设备端刷入
          回滚: fastboot flash boot boot_a.img (仓库内原版)"
